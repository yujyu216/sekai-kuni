  .country-name { font-size: 40px; font-weight: bold; text-align: center; margin: 8px 0 0; }

function flagSVG(id) {
  const f = FLAGS[id];
  return '<svg viewBox="' + f.vb + '" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">' + f.body + '</svg>';
}
function showView(v) {
  document.getElementById('viewHome').classList.toggle('hidden', v !== 'Home');
  document.getElementById('viewLearn').classList.toggle('hidden', v !== 'Learn');
  document.getElementById('viewQuiz').classList.toggle('hidden', v !== 'Quiz');
  window.scrollTo(0, 0);
}

/* ---------- ホーム ---------- */
const REGION_ICON = { 'アジア': '🌏', 'ヨーロッパ': '🌍', 'アフリカ': '🌍', '北アメリカ': '🌎', '南アメリカ': '🌎', 'オセアニア': '🌏' };
function renderHome() {
  document.getElementById('progress').textContent = 'おぼえた：' + learned.length + '／28か国';
  const regions = [];
  COUNTRIES.forEach(c => { if (regions.indexOf(c.region) < 0) regions.push(c.region); });
  let html = '';
  regions.forEach(r => {
    html += '<div class="region-title">' + (REGION_ICON[r] || '🌍') + ' ' + r + '</div><div class="tiles">';
    COUNTRIES.filter(c => c.region === r).forEach(c => {
      html += '<button class="tile" onclick="openCountry(\'' + c.id + '\')">'
        + '<span class="tflag">' + flagSVG(c.id) + '</span>'
        + '<span class="tname">' + c.nameYomi + '</span>'
        + '<span class="tstar">' + (isLearned(c.id) ? '⭐ おぼえた' : '　') + '</span></button>';
    });
    html += '</div>';
  });
  document.getElementById('regions').innerHTML = html;
}
function goHome() { renderHome(); showView('Home'); }

/* ---------- 国ページ（知る） ---------- */
let current = null;
function greetBlock(label, word, yomi) {
  return '<div class="greet"><div>'
    + '<div class="jp">' + label + '</div>'
    + '<div class="word">' + word + '</div>'
    + '<div class="yomi">' + yomi + '</div></div>'
    + '<button class="speak spk" onclick="speak(\'' + yomi + '\')">🔊</button></div>';
}
function openCountry(id) {
  current = byId[id];
  const c = current;
  document.getElementById('viewLearn').innerHTML =
    '<button class="backbtn" onclick="goHome()">← ホームに もどる</button>'
    + '<div class="readall"><button class="speak" onclick="readLearnAll()">🔊 ぜんぶ よんで</button></div>'
    + '<div class="card flagbox">'
    + '<div class="flag" role="img" aria-label="' + c.name + 'の国旗">' + flagSVG(c.id) + '</div>'
    + '<div class="country-name">' + c.name + '</div>'
    + '<div class="capital">しゅと：' + c.capital + '</div>'
    + (isLearned(c.id) ? '<div class="learned-badge">⭐ おぼえた！</div>' : '')
    + '</div>'
    + '<div class="card"><h2>ゆうめいな ばしょ</h2>'
    + '<img class="place-img" src="' + IMG[c.id] + '" alt="' + c.place + 'のイラスト">'
    + '<div class="place-name">' + c.place + '</div></div>'
    + '<div class="card"><h2>' + c.nameYomi + 'って どんな国？ '
    + '<button class="speak small" onclick="speak(current.intro.join(\'\'))">🔊 よんで</button></h2>'
    + '<p class="intro">' + c.intro.join('<br>') + '</p></div>'
    + '<div class="card"><h2>' + c.nameYomi + 'の ことば（' + c.lang + '）</h2>'
    + greetBlock('こんにちは', c.hello, c.helloYomi)
    + greetBlock('ありがとう', c.thanks, c.thanksYomi)
    + '</div>'
    + '<div class="readall"><button class="speak" onclick="startQuiz()">❓ クイズに ちょうせん！</button></div>';
  showView('Learn');
}
function readLearnAll() {
  const c = current;
  speak(c.nameYomi + '。しゅとは' + c.capitalYomi + '。ゆうめいなばしょは、' + c.placeYomi + '。'
    + c.intro.join('') + c.nameYomi + 'のことば。こんにちはは、' + c.helloYomi + '。ありがとうは、' + c.thanksYomi + '。');
}

/* ---------- クイズ ---------- */
let questions = [], qi = 0, locked = false;
function pickOthers(n, pred) {
  return shuffle(COUNTRIES.filter(x => x.id !== current.id && pred(x))).slice(0, n);
}
function buildQuestions() {
  const c = current;
  const oName = pickOthers(2, () => true).map(x => x.nameYomi);
  const oName2 = pickOthers(2, () => true).map(x => x.nameYomi);
  const oCap = pickOthers(2, () => true).map(x => x.capitalYomi);
  const seen = {}; const oTh = [];
  shuffle(COUNTRIES.filter(x => x.id !== c.id && x.thanksYomi !== c.thanksYomi)).forEach(x => {
    if (!seen[x.thanksYomi] && oTh.length < 2) { seen[x.thanksYomi] = 1; oTh.push(x.thanksYomi); }
  });
  return [
    { q: c.placeYomi + 'が ある 国は どこ？', say: c.placeYomi + 'が ある 国は どこ？', img: 'place',
      choices: [c.nameYomi].concat(oName), answer: c.nameYomi },
    { q: 'この 国旗（こっき）は どこの 国？', say: 'この こっきは どこの 国？', img: 'flag',
      choices: [c.nameYomi].concat(oName2), answer: c.nameYomi },
    { q: c.nameYomi + 'の しゅとは どこ？', say: c.nameYomi + 'の しゅとは どこ？', img: null,
      choices: [c.capitalYomi].concat(oCap), answer: c.capitalYomi },
    { q: c.nameYomi + 'で 「ありがとう」は なんていう？', say: c.nameYomi + 'で、ありがとうは なんていう？', img: null,
      choices: [c.thanksYomi].concat(oTh), answer: c.thanksYomi }
  ];
}
function startQuiz() { questions = buildQuestions(); qi = 0; showView('Quiz'); renderQ(); }
function quitQuiz() { openCountry(current.id); }
function renderQ() {
  locked = false;
  const box = document.getElementById('quizCard');
  if (qi >= questions.length) {
    if (!isLearned(current.id)) { learned.push(current.id); saveLearned(); }
    box.innerHTML = '<div class="finish">🎉 ぜんぶ できたね！<br>' + current.nameYomi + 'の こと、<br>たくさん おぼえたね。<br>⭐ ' + current.nameYomi + 'を おぼえた！</div>'
      + '<button class="nextbtn" style="display:block" onclick="startQuiz()">🔁 もう一回 クイズ</button>'
      + '<button class="nextbtn" style="display:block;background:#fff;color:#e08a00;border:3px solid #ffb84d" onclick="openCountry(\'' + current.id + '\')">📖 しるページに もどる</button>'
      + '<button class="nextbtn" style="display:block;background:#fff;color:#e08a00;border:3px solid #ffb84d" onclick="goHome()">🏠 ホームに もどる</button>';
    speak('ぜんぶできたね！' + current.nameYomi + 'のこと、たくさんおぼえたね。');
    return;
  }
  const item = questions[qi];
  let imgHtml = '';
  if (item.img === 'place') imgHtml = '<div class="qimg"><img src="' + IMG[current.id] + '" alt="' + current.place + 'のイラスト"></div>';
  if (item.img === 'flag') imgHtml = '<div class="qimg"><div class="flag">' + flagSVG(current.id) + '</div></div>';
  const choices = shuffle(item.choices.slice()).map(c =>
    '<div class="choice-row"><button class="choice" onclick="answer(this,\'' + c + '\')">' + c + '</button>'
    + '<button class="choice-speak" onclick="speak(\'' + c + '\')" aria-label="よんで">🔊 よんで</button></div>').join('');
  box.innerHTML =
    '<div class="qnum">もんだい ' + (qi + 1) + ' / ' + questions.length
    + '　<button class="speak small" onclick="speak(\'' + item.say + '\')">🔊 よんで</button></div>'
    + '<div class="qtext">' + item.q + '</div>' + imgHtml
    + '<div class="choices">' + choices + '</div>'
    + '<div class="feedback" id="fb"></div>'
    + '<button class="nextbtn" id="nextBtn" onclick="qi++;renderQ()">つぎへ ▶</button>';
}
function answer(btn, choice) {
  if (locked) return;
  const item = questions[qi];
  const fb = document.getElementById('fb');
  if (choice === item.answer) {
    locked = true;
    btn.classList.add('correct');
    fb.textContent = '⭕ せいかい！ すごいね！';
    fb.className = 'feedback good';
    speak('せいかい！すごいね！');
    document.getElementById('nextBtn').style.display = 'block';
  } else {
    btn.classList.add('wrong');
    btn.disabled = true;
    fb.textContent = 'おしい！ もう一回 かんがえて みよう';
    fb.className = 'feedback try';
    speak('おしい！もう一回かんがえてみよう。');
  }
}

/* ---------- 初期化 ---------- */
document.getElementById('decoSame').src = PAYLOAD.decoSame;
document.getElementById('decoShima').src = PAYLOAD.decoShima;
renderHome();
</script>
</body>
</html>
